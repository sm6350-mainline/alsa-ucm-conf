# Use case configuration for Fairphone 4
# Author: Luca Weiss <luca.weiss@fairphone.com>

SectionVerb {
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Mic1" {
	Comment "Bottom Microphone"

	Include.wcdmice.File "/codecs/wcd938x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/AnalogMic1DisableSeq.conf"

	EnableSequence [
		# TODO: /codecs/qcom-lpass/tx-macro-v9/SoundwireMic0EnableSeq.conf?
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		# TODO: /codecs/qcom-lpass/tx-macro-v9/SoundwireMicDisableSeq.conf? (or use 'tx-macro' variant)
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC1"
		CaptureVolume "ADC1 Volume"
	}
}

SectionDevice."Mic3" {
	Comment "Top Microphone"

	Include.wcdmice.File "/codecs/wcd938x/AnalogMic3EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/AnalogMic3DisableSeq.conf"

	EnableSequence [
		# TODO: /codecs/qcom-lpass/tx-macro-v9/SoundwireMic1EnableSeq.conf?
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		# TODO: /codecs/qcom-lpass/tx-macro-v9/SoundwireMicDisableSeq.conf? (or use 'tx-macro' variant)
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC1"
		CaptureVolume "ADC1 Volume"
	}
}
