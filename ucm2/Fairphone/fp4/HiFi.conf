# Use case configuration for Fairphone 4
# Author: Luca Weiss <luca.weiss@fairphone.com>

SectionVerb {
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value.TQ "HiFi"
}

# Both outputs are aw88264 amplifiers on the QUIN_MI2S_RX link:
#   3-0034 (DT "left")  = earpiece, top
#   3-0035 (DT "right") = loudspeaker, bottom
# They form a stereo pair for music; the codec's own EAR/HPH pins are unrouted
# on this board. "Speaker" drives both, "Earpiece" drives the left one alone.

SectionDevice."Speaker" {
	Comment "Loudspeaker and earpiece as a stereo pair"

	# Both amplifiers on. The Earpiece device switches the right one off, and
	# if its DisableSequence never runs (e.g. a session manager that switches
	# devices without disabling the old one first) nothing else turns it back
	# on, leaving the loudspeaker silent.
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='aw882xx_pa_switch_l' On"
		cset "name='aw882xx_pa_switch_r' On"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority "200"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece (left amplifier only)"

	# Silence the right (loudspeaker) amplifier so a call is not on speaker;
	# restored on disable so the session manager does not persist a muted route.
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='aw882xx_pa_switch_r' Off"
	]

	DisableSequence [
		cset "name='aw882xx_pa_switch_r' On"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority "100"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone"

	# Capture path: AMIC1 -> ADC1 (wcd938x) -> SoundWire -> decimators ->
	# TX_AIF1_CAP -> TX_CODEC_DMA_TX_3 -> MultiMedia2.
	#
	# Both decimators are fed from ADC0 on purpose: the machine driver's
	# be_hw_params_fixup() forces the backend to two channels, so a single
	# decimator leaves the second slot unsourced and capture times out with
	# EIO. Duplicating the one analogue mic onto both channels satisfies the
	# channel count and is what userspace wants from a mono mic.
	#
	# The MUX item list is the lpass_ver_9 vocabulary (ADC0..3, SWR_DMIC0..7),
	# so ADC0 here is the codec's AMIC1.
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='ADC1 Switch' 1"
		# Puts the ADC on the SoundWire TX port. Without it, starting from a
		# clean mixer state, every capture fails with EIO.
		cset "name='ADC1_MIXER Switch' 1"
		# Capture gain: analogue PGA (ADC1 Volume, 0..20 = 0..30 dB) at max,
		# plus a small digital trim (TX_DEC Volume, 84 = 0 dB, 88 = +4 dB).
		cset "name='ADC1 Volume' 20"
		cset "name='TX_DEC0 Volume' 88"
		cset "name='TX_DEC1 Volume' 88"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
	]

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels "2"
		CapturePriority "100"
	}
}
